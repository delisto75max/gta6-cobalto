<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COBALTO — Bahía Caliente</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050b0e; }
    #stage {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: radial-gradient(120% 90% at 50% 20%, #10242a 0%, #050b0e 70%);
    }
    #frame {
      position: relative;
      width: min(100vw, 177.777vh);
      height: min(56.25vw, 100vh);
      overflow: hidden;
      background: #0a1418;
      box-shadow: 0 0 80px rgba(0, 0, 0, .55);
    }
    canvas { display: block; width: 100%; height: 100%; }
    #game { position: absolute; inset: 0; }
    #hud { position: absolute; inset: 0; pointer-events: none; }
    #boot {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: linear-gradient(#10242a, #0b1418 55%, #1b2420);
      color: #f6ead8; font: 600 13px/1.6 system-ui, -apple-system, Segoe UI, sans-serif;
      letter-spacing: .34em; text-transform: uppercase; transition: opacity .45s ease;
      z-index: 5;
    }
    #boot small { display: block; margin-top: 12px; letter-spacing: .12em; color: #d7a86e; font-weight: 500; }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .bar { width: 220px; height: 2px; margin: 18px auto 0; background: rgba(246, 234, 216, .18); overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 40%; background: #ffcf6b; animation: load 1.1s ease-in-out infinite; }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <canvas id="game" width="1280" height="720"></canvas>
      <canvas id="hud" width="1280" height="720"></canvas>
      <div id="boot">Bahía Cobalto<small>the castle is loading · 17:40</small><div class="bar"><i></i></div></div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
